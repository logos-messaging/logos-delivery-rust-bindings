# copy of https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md
on:
  push:
    branches: [master]
  pull_request:
    branches:
      - "*"

name: CI

jobs:
  check:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          #- os: windows-latest
          #  toolchain: stable-x86_64-pc-windows-gnu
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          default: true
          override: true
      - uses: actions-rs/cargo@v1
        continue-on-error: false
        with:
          command: check

  test:
    name: Test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          #- os: windows-latest
          #  toolchain: stable-x86_64-pc-windows-gnu
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          default: true
          override: true
      - uses: actions-rs/cargo@v1
        continue-on-error: false
        with:
          command: build
      # The logos-delivery crate needs liblogosdelivery; it is tested in its own job.
      - uses: actions-rs/cargo@v1
        continue-on-error: false
        with:
          command: test
          args: --workspace --exclude logos-delivery

  logos-delivery:
    name: logos-delivery crate (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # The crate does not use the vendor submodule.
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          default: true
          override: true
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
      # The library at the revision the bindings were generated from (LOGOS_DELIVERY_REV).
      - name: Build liblogosdelivery
        run: |
          rev=$(cat LOGOS_DELIVERY_REV)
          out=$(nix build --impure --no-link --print-out-paths --expr "
            let f = builtins.getFlake \"github:logos-messaging/logos-delivery/$rev\";
            in f.packages.\${builtins.currentSystem}.liblogosdelivery.override {
              enablePostgres = false;
              enableNimDebugDlOpen = false;
              chroniclesLogLevel = \"FATAL\";
            }")
          echo "LOGOS_DELIVERY_LIB_DIR=$out/lib" >> "$GITHUB_ENV"
      # Nodes in one process share the persistence root and ports: run serially.
      # The runner has no patchelf, so the library cannot be stamped; linking it in
      # place is fine for this crate's own tests.
      - run: cargo test -p logos-delivery -- --test-threads=1
        env:
          LOGOS_DELIVERY_ALLOW_UNSTAMPED: "1"

  lints:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        continue-on-error: false
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        continue-on-error: false
        with:
          command: clippy
          args: -- --deny warnings
